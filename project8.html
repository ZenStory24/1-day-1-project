<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="rifqi">
    <meta name="description" content="1 day 1 project(project: to do list)">
    <title>To Do List</title>
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.light {
    background-color: #f4f7f6;
}

.dark {
    background-color: #292929;
}

h2 {
  font-size: 2rem;
  color: #2c3e50;
  margin-bottom: 5px;
}

h5 {
  font-size: 1rem;
  color: #7f8c8d;
  font-weight: 500;
  margin-bottom: 20px;
}

#input {
  width: 100%;
  max-width: 400px;
  padding: 12px 15px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s ease;
  margin-bottom: 12px;
}

#input:focus {
  border-color: #3498db;
}

#btn {
  top: 10px;
  right: 10px;
  position: absolute;
}

#btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #2980b9;
}

button {
  padding: 10px 18px;
  font-size: 0.95rem;
  font-weight: 600;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  margin: 0 4px 20px 4px;
}

#button1 {
  background-color: #2ecc71;
  color: white;
}

#button1:hover {
  background-color: #27ae60;
}

#button2 {
  background-color: #ecf0f1;
  color: #2c3e50;
  border: 1px solid #bdc3c7;
}

#button2:hover {
  background-color: #bdc3c7;
}

#container {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#container > div {
  background-color: #ffffff;
  padding: 12px 16px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
  user-select: none;
}

#container > div:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

#container input[type='checkbox'] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #3498db;
}

#container span {
  font-size: 1rem;
  word-break: break-word;
  color: #2c3e50;
}
    </style>
</head>
<body class='light'>
    
  <button id='btn'>Light Mode☀️</button>
  
  <h2 id='h2'>To Do List</h2>
  <h5>Just Do It.</h5>
  
  <input id='input' type='text' placeholder='Buat Tugas Baru...'>
  <button id='button1'>Buat</button>
  <button id='button2'>Hapus Daftar</button>
  
  <div id='container'></div>
  
  <script>
      const input = document.getElementById('input');
const btn1 = document.getElementById('button1');
const btn2 = document.getElementById('button2');
const container = document.getElementById('container');

let data = [];
let isDeleteMode = false;

function saveToLocalStorage() {
  const saved = JSON.stringify(data);
  localStorage.setItem('MY_TODOS', saved);
}

function loadToLocalStorage() {
  const saved = localStorage.getItem('MY_TODOS');
  if (saved) {
    data = JSON.parse(saved);
  }
}

function renderData() {
  container.innerHTML = '';
  for (let i = 0; i < data.length; i++) {
    const item = data[i];
    const element = document.createElement('div');
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = item.isCompleted;
    
    const text = document.createElement('span');
    text.textContent = item.text;
    
    if (item.isCompleted) {
      text.style.textDecoration = 'line-through';
    }
    
    element.appendChild(checkbox);
    element.appendChild(text);
    
    container.appendChild(element);
    
    checkbox.addEventListener('click', function() {
      data[i].isCompleted = checkbox.checked;
      saveToLocalStorage();
      renderData();
    });
    
    element.addEventListener('click', function() {
      if (isDeleteMode === true) {
        const confirmation = confirm('Yakin ingin menghapus tugas ini?');
        if (confirmation === true) {
          data.splice(i, 1);
          saveToLocalStorage();
          renderData();
        }
      }
    });
  }
}

function clearInput() {
  if (input.value !== '') {
    input.value = '';
  }
}

btn2.addEventListener('click', function() {
  if (isDeleteMode === false) {
    isDeleteMode = true;
    btn2.style.backgroundColor = 'red';
  } else {
    btn2.style.backgroundColor = 'white';
    isDeleteMode = false;
  }
});

btn1.addEventListener('click', function() {
  const value = input.value.trim();
  if (value !== '') {
    const object = {
    id: Date.now(),
    text: value,
    isCompleted: false
    }
    
    data.push(object);
    
    saveToLocalStorage();
    renderData();
    clearInput();
  }
});

loadToLocalStorage();
renderData();
  </script>
  
  <script>
      const btn = document.getElementById('btn');
const h2 = document.getElementById('h2');
const body = document.querySelector('.light');

const swapToLight = () => {
    body.classList.remove('dark');
    body.classList.add('light');
    h2.style.color = '#2c3e50';
    btn.innerHTML = 'Light Mode☀️';
}

const swapToDark = () => {
    body.classList.remove('light');
    body.classList.add('dark');
    h2.style.color = '#aafff4';
    btn.innerHTML = 'Dark Mode🌙';
}

btn.addEventListener('click', function() {
    if (body.classList.contains('light')) {
        swapToDark();
    } else {
        swapToLight();
    }
});
console.log('semoga author bisa juara LKS');
  </script>
</body>
</html>
